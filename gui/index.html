<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaCouncil Runs</title>
<style>
  :root {
    --bg: #0f1412; --panel: #151c19; --line: #24302b; --text: #d7e2dc; --dim: #8aa096;
    --accent: #35b891; --gold: #c9a227; --red: #d4736a;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.65 -apple-system, "PingFang SC", "Hiragino Sans", sans-serif; height: 100vh; display: flex; overflow: hidden; }
  aside { width: 300px; min-width: 300px; border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  aside h1 { font-size: 15px; padding: 16px 16px 8px; color: var(--accent); letter-spacing: .04em; }
  aside h1 small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .run { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .run:hover, .run.active { background: #1b2420; }
  .run .sym { font-weight: 600; font-size: 15px; }
  .run .meta { color: var(--dim); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { padding: 0 7px; border-radius: 9px; font-size: 11px; border: 1px solid var(--line); }
  .badge.completed, .badge.complete { color: var(--accent); border-color: var(--accent); }
  .badge.incomplete, .badge.failed { color: var(--red); border-color: var(--red); }
  .badge.running, .badge.in_progress { color: var(--gold); border-color: var(--gold); }
  main { flex: 1; overflow-y: auto; padding: 24px 40px 80px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; position: sticky; top: -24px; background: var(--bg); padding: 12px 0; z-index: 2; }
  select, button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  #doc { max-width: 900px; }
  #doc h1 { font-size: 24px; margin: 18px 0 10px; }
  #doc h2 { font-size: 19px; margin: 26px 0 10px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  #doc h3 { font-size: 16px; margin: 20px 0 8px; }
  #doc h4, #doc h5 { font-size: 14px; margin: 16px 0 6px; color: var(--gold); }
  #doc p { margin: 8px 0; }
  #doc ul, #doc ol { margin: 8px 0 8px 22px; }
  #doc blockquote { border-left: 3px solid var(--accent); padding: 4px 14px; margin: 10px 0; color: var(--dim); background: var(--panel); border-radius: 0 6px 6px 0; }
  #doc code { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12.5px; }
  #doc pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 10px 0; }
  #doc pre code { border: 0; padding: 0; }
  #doc table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13px; }
  #doc th, #doc td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  #doc th { background: var(--panel); color: var(--accent); }
  #doc tr:nth-child(even) td { background: #131a17; }
  #doc a { color: var(--accent); }
  #doc hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  .empty { color: var(--dim); padding: 60px 0; text-align: center; }
</style>
</head>
<body>
<aside>
  <h1>AlphaCouncil <small>运行记录</small></h1>
  <div id="runs"></div>
</aside>
<main>
  <div class="toolbar" id="toolbar" hidden>
    <select id="file"></select>
    <button id="refresh">刷新</button>
    <button id="auto">自动刷新: 关</button>
  </div>
  <div id="doc"><div class="empty">← 选择一次运行查看报告</div></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null, timer = null;

// ponytail: ~70-line markdown renderer covers the report contract's markdown
// (headings/tables/lists/quotes/fences/bold); swap for a real parser if it falls short.
const esc = (s) => String(s)
  .replace(/&/g, "&amp;")
  .replace(/</g, "&lt;")
  .replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;")
  .replace(/'/g, "&#39;");
const safeHref = (value) => {
  if (typeof value !== "string" || /[\u0000-\u0020\u007f"'<>`\\]/u.test(value)) return null;
  try {
    const parsed = new URL(value);
    if (!["http:", "https:"].includes(parsed.protocol)) return null;
    if (parsed.username || parsed.password) return null;
    return parsed.href;
  } catch {
    return null;
  }
};
const decorate = (value) => value
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
function inline(s) {
  const links = [];
  const tokenized = String(s).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (whole, label, href) => {
    const safe = safeHref(href);
    if (!safe) return whole;
    const token = `\u0000AC_LINK_${links.length}\u0000`;
    links.push(`<a href="${esc(safe)}" target="_blank" rel="noopener noreferrer">${decorate(esc(label))}</a>`);
    return token;
  });
  return decorate(esc(tokenized)).replace(/\u0000AC_LINK_(\d+)\u0000/g, (_, index) => links[Number(index)] || "");
}
function renderMd(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let list = null, quote = false, fence = false, table = null;
  const closeAll = () => {
    if (list) { out.push(`</${list}>`); list = null; }
    if (quote) { out.push("</blockquote>"); quote = false; }
    if (table) { out.push("</table>"); table = null; }
  };
  for (const raw of lines) {
    if (/^```/.test(raw)) { closeAll(); out.push(fence ? "</code></pre>" : "<pre><code>"); fence = !fence; continue; }
    if (fence) { out.push(esc(raw)); continue; }
    const line = raw.trimEnd();
    const h = line.match(/^(#{1,5})\s+(.*)/);
    if (h) { closeAll(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) { closeAll(); out.push("<hr>"); continue; }
    if (/^\|/.test(line)) {
      const cells = line.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      if (cells.every((c) => /^:?-{2,}:?$/.test(c))) continue;
      if (!table) { closeAll(); out.push("<table>"); table = "th"; }
      out.push("<tr>" + cells.map((c) => `<${table}>${inline(c)}</${table}>`).join("") + "</tr>");
      if (table === "th") table = "td";
      continue;
    } else if (table) { out.push("</table>"); table = null; }
    const q = line.match(/^>\s?(.*)/);
    if (q) { if (!quote) { closeAll(); out.push("<blockquote>"); quote = true; } out.push(`<p>${inline(q[1])}</p>`); continue; }
    if (quote) { out.push("</blockquote>"); quote = false; }
    const li = line.match(/^\s*([-*]|\d+\.)\s+(.*)/);
    if (li) {
      const kind = /^\d/.test(li[1]) ? "ol" : "ul";
      if (list !== kind) { if (list) out.push(`</${list}>`); out.push(`<${kind}>`); list = kind; }
      out.push(`<li>${inline(li[2])}</li>`); continue;
    } else if (list) { out.push(`</${list}>`); list = null; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  closeAll();
  if (fence) out.push("</code></pre>");
  return out.join("\n");
}

async function loadRuns() {
  const runs = await (await fetch("/api/runs")).json();
  $("runs").innerHTML = runs.map((r) => `
    <div class="run ${r.run_id === current ? "active" : ""}" data-id="${esc(r.run_id)}">
      <div class="sym">${esc(r.symbol || "?")} <span class="badge ${esc(r.status)}">${esc(r.status)}</span></div>
      <div class="meta">
        <span>${esc(r.council_mode || "")}${r.council_pace ? " · " + esc(r.council_pace) : ""}</span>
        <span>${r.started_at ? new Date(r.started_at).toLocaleString() : ""}</span>
      </div>
    </div>`).join("") || '<div class="empty">还没有运行记录</div>';
  for (const el of document.querySelectorAll(".run")) el.onclick = () => openRun(el.dataset.id);
}

const PREFERRED = ["final_report.md", "user_response.md", "all_agents.md"];
async function openRun(id, keepFile) {
  current = id;
  const { files } = await (await fetch(`/api/runs/${encodeURIComponent(id)}/files`)).json();
  const mds = files.filter((f) => f.endsWith(".md"));
  mds.sort((a, b) => (PREFERRED.indexOf(a) + 99 & 127) - (PREFERRED.indexOf(b) + 99 & 127) || a.localeCompare(b));
  const keep = keepFile && mds.includes(keepFile) ? keepFile : mds[0];
  $("file").innerHTML = mds.map((f) => `<option ${f === keep ? "selected" : ""}>${esc(f)}</option>`).join("");
  $("toolbar").hidden = false;
  loadRuns();
  await loadFile();
}
async function loadFile() {
  if (!current) return;
  const name = $("file").value;
  const text = await (await fetch(`/api/runs/${encodeURIComponent(current)}/file?name=${encodeURIComponent(name)}`)).text();
  $("doc").innerHTML = renderMd(text) || '<div class="empty">(空文件)</div>';
}
$("file").onchange = loadFile;
$("refresh").onclick = () => openRun(current, $("file").value);
$("auto").onclick = () => {
  if (timer) { clearInterval(timer); timer = null; $("auto").textContent = "自动刷新: 关"; $("auto").classList.remove("on"); }
  else { timer = setInterval(() => current && openRun(current, $("file").value), 5000); $("auto").textContent = "自动刷新: 开"; $("auto").classList.add("on"); }
};
loadRuns();
setInterval(loadRuns, 15000);
</script>
</body>
</html>
